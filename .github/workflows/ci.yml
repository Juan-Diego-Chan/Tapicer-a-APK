name: CI

on:
  push:
    branches: [main, 'plan-*']
  pull_request:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Gradle descarga su distribución y el compilador de Kotlin desde
      # github.com, que a veces responde 504; se reintenta antes de fallar.
      - name: Compilar el APK de depuración
        shell: bash
        run: |
          for intento in 1 2 3; do
            flutter build apk --debug && exit 0
            echo "Intento $intento falló; se reintenta en 30 s"
            sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: tapiceria-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  reglas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/pruebas_reglas/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm i -g firebase-tools
      - run: cd firebase/pruebas_reglas && npm ci && npm test
