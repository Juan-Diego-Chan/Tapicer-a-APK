name: Publicar

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Revisar secretos de firma
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Faltan los secretos de firma"
            exit 1
          fi
      - name: Decodificar el keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tapiceria.jks"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Compilar el APK de release
        env:
          TAPICERIA_KEYSTORE: ${{ runner.temp }}/tapiceria.jks
          TAPICERIA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TAPICERIA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TAPICERIA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Renombrar el APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "tapiceria-${{ github.ref_name }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: app/tapiceria-${{ github.ref_name }}.apk
